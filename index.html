<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instrike</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/icons/favicon-32.svg">
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/icons/favicon-16.svg">
  <script type="module" crossorigin src="./assets/index-CccVhvr-.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-g0v-MWpK.css">
</head>

<body>
    <div id="connection-lost-msg" class="hidden">We are having some issues. Check your device internet connection</div>

    <!-- Landing Page (rendered by client/components/landing-page.js) -->
    <landing-page id="landing-page"></landing-page>

    <!-- Main App UI -->
    <div id="main-app-container" class="hidden">
        <canvas id="three-canvas"></canvas>

        <div id="mobile-drill-controls" class="mobile-drill-controls hidden">
            <button id="mobile-play-pause-btn" class="mobile-control-button play-pause">
                <svg viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"></path>
                </svg>
            </button>
            <button id="mobile-stop-btn" class="mobile-control-button stop">
                <svg viewBox="0 0 24 24">
                    <path d="M6 6h12v12H6z" />
                </svg>
            </button>
        </div>

        <div id="countdown-container" class="hidden"></div>

        <!-- Info Overlay Panel -->
        <info-overlay id="info-overlay" class="hidden"></info-overlay>

        <!-- Sidebar -->
        <div class="left-sidebar">
            <div id="main-sidebar-content">
                <div class="sidebar-top-bar">
                    <div class="mobile-panel-header-inline">
                        <sidebar-button id="close-sidebar-mobile-btn" variant="back" data-tooltip="Close Sidebar"
                            data-tooltip-position="top">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
                            </svg>
                        </sidebar-button>
                    </div>
                    <div class="sidebar-top-bar-actions">
                        <sidebar-button id="leave-session-btn" variant="transparent" class="session-only hidden"
                            data-tooltip="Leave Session" data-tooltip-position="bottom">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"
                                style="fill: none; stroke: #ccc; transform: scaleX(-1);">
                                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                                <polyline points="10 17 15 12 10 7"></polyline>
                                <line x1="15" y1="12" x2="3" y2="12"></line>
                            </svg>
                        </sidebar-button>
                        <sidebar-button id="share-btn" variant="transparent" class="session-only hidden"
                            data-tooltip="Share Session" data-tooltip-position="bottom"><svg viewBox="0 0 24 24">
                                <path
                                    d="M18,16.08C17.24,16.08 16.56,16.38 16.04,16.85L8.91,12.7C8.96,12.47 9,12.24 9,12C9,11.76 8.96,11.53 8.91,11.3L16.04,7.15C16.56,7.62 17.24,7.92 18,7.92C19.66,7.92 21,6.58 21,4.92C21,3.26 19.66,1.92 18,1.92C16.34,1.92 15,3.26 15,4.92C15,5.16 15.04,5.39 15.09,5.62L7.96,9.77C7.44,9.3 6.76,9 6,9C4.34,9 3,10.34 3,12C3,13.66 4.34,15 6,15C6.76,15 7.44,14.7 7.96,14.23L15.09,18.38C15.04,18.61 15,18.84 15,19.08C15,20.74 16.34,22.08 18,22.08C19.66,22.08 21,20.74 21,19.08C21,17.42 19.66,16.08 18,16.08Z" />
                            </svg>
                        </sidebar-button>
                    </div>
                </div>
                <div class="sidebar-scroll-content">
                    <div class="hud-section user-section">
                        <div id="user-list-container">
                            <!-- Vertical layout for many users -->
                            <div class="other-users-section">
                                <div class="other-users-container">
                                    <div id="sticky-user-slot"></div>
                                    <div class="users-list">
                                        <!-- Users will be populated here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- <div class="section-divider"></div> -->
                    <div class="hud-section controls-section">
                        <div class="indicators-group">
                            <div class="indicator">
                                <div class="indicator-label">SPEED</div>
                                <div class="value-control">
                                    <div id="speed-indicator-value" class="indicator-value">6.5</div>
                                    <div class="speed-btn-stack">
                                        <button id="speed-up-btn" class="speed-btn">+</button>
                                        <button id="speed-down-btn" class="speed-btn">-</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="buttons-group">
                            <div class="indicator-label">EXERCISE</div>
                            <div id="current-exercise-panel" class="exercise-panel">
                                <div class="exercise-list">
                                    <exercise-item active name="Warm Up" description="Basic reflex and movement drills.">
                                        <div class="chevron-icon">
                                            <svg viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z" />
                                            </svg>
                                        </div>
                                    </exercise-item>
                                </div>
                            </div>
                            <div class="playback-controls">
                                <div class="playback-group">
                                    <sidebar-button id="configure-btn" variant="circular" class="configure-btn"
                                        data-tooltip="Configure Current Exercise (M)" data-tooltip-position="top">
                                        <svg viewBox="0 0 24 24">
                                            <path
                                                d="M14.06,9L15,9.94L5.92,19H5V18.08L14.06,9M17.66,3C17.41,3 17.15,3.1 16.96,3.29L15.13,5.12L18.88,8.87L20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18.17,3.09 17.92,3 17.66,3M14.06,6.19L3,17.25V21H6.75L17.81,9.94L14.06,6.19Z" />
                                        </svg>
                                    </sidebar-button>
                                    <sidebar-button id="test-btn" variant="circular" class="test-btn"
                                        data-tooltip="Test (T)" data-tooltip-position="top">
                                        TEST
                                    </sidebar-button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="hud-section">
                        <div class="general-stats">
                            <div class="stat-item">
                                <div class="stat-label">Time Active</div>
                                <div class="stat-value">18:42</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Strikes</div>
                                <div class="stat-value">412</div>
                            </div>
                        </div>
                        <div id="histogram" class="histogram-container">
                            <div class="histogram-row" data-bucket-label="0-2">
                                <div class="col-num">0-2</div>
                                <div class="col-int">0</div>
                                <div class="col-bar">
                                    <div class="bar" style="width: 1%;"></div>
                                </div>
                            </div>
                            <div class="histogram-row" data-bucket-label="3">
                                <div class="col-num">3</div>
                                <div class="col-int">0</div>
                                <div class="col-bar">
                                    <div class="bar" style="width: 1%;"></div>
                                </div>
                            </div>
                            <div class="histogram-row" data-bucket-label="4">
                                <div class="col-num">4</div>
                                <div class="col-int">0</div>
                                <div class="col-bar">
                                    <div class="bar" style="width: 1%;"></div>
                                </div>
                            </div>
                            <div class="histogram-row" data-bucket-label="5">
                                <div class="col-num">5</div>
                                <div class="col-int">0</div>
                                <div class="col-bar">
                                    <div class="bar" style="width: 1%;"></div>
                                </div>
                            </div>
                            <div class="histogram-row" data-bucket-label="6">
                                <div class="col-num">6</div>
                                <div class="col-int">0</div>
                                <div class="col-bar">
                                    <div class="bar" style="width: 1%;"></div>
                                </div>
                            </div>
                            <div class="histogram-row" data-bucket-label="7">
                                <div class="col-num">7</div>
                                <div class="col-int">0</div>
                                <div class="col-bar">
                                    <div class="bar" style="width: 1%;"></div>
                                </div>
                            </div>
                            <div class="histogram-row" data-bucket-label="8+">
                                <div class="col-num">8+</div>
                                <div class="col-int">0</div>
                                <div class="col-bar">
                                    <div class="bar" style="width: 1%;"></div>
                                </div>
                            </div>
                        </div>
                        <div class="stats-footer">
                            <div class="playback-group">
                                <sidebar-button id="clear-stats-btn" variant="circular"
                                    data-tooltip="Clear Counters (Backspace)" data-tooltip-position="top">
                                    <svg viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M22,3H7C6.31,3 5.77,3.35 5.41,3.88L0,12L5.41,20.11C5.77,20.64 6.31,21 7,21H22A2,2 0 0,0 24,19V5A2,2 0 0,0 22,3M19,15.59L17.59,17L14,13.41L10.41,17L9,15.59L12.59,12L9,8.41L10.41,7L14,10.59L17.59,7L19,8.41L15.41,12L19,15.59Z">
                                        </path>
                                    </svg>
                                </sidebar-button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="sidebar-bottom-controls">
                    <button id="start-btn" class="control-button play-pause tooltip" data-tooltip="Start (Space)"
                        data-tooltip-position="top">
                        <svg viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"></path>
                        </svg>
                    </button>
                    <button id="stop-btn" class="control-button tooltip" data-tooltip="Stop (Esc)"
                        data-tooltip-position="top"><svg viewBox="0 0 24 24">
                            <path d="M6 6h12v12H6z" />
                        </svg></button>
                </div>
            </div>

            <div id="exercise-selection-panel">
                <div class="mobile-panel-header">
                    <button id="back-to-sidebar-btn" class="back-button tooltip" data-tooltip="Go Back"
                        data-tooltip-position="top">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
                        </svg>
                        <!-- <span>Back</span> -->
                    </button>
                </div>
                <div class="user-search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24">
                        <path
                            d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                    </svg>
                    <input type="text" id="exercise-search" class="search-input" placeholder="Search exercises...">
                </div>
                <div id="full-exercise-list" class="exercise-list">
                </div>
            </div>

        </div>

        <div id="sidebar-toggle-btn" class="tooltip">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" />
            </svg>
        </div>

    </div>

    <!-- Mobile Bottom Navbar -->
    <bottom-navbar id="bottom-navbar" class="hidden"></bottom-navbar>

    <div id="global-tooltip"></div>


    <!-- Profile Screen (header removed for compact layout) -->
    <div id="profile-screen" class="full-screen hidden">
        <div class="full-screen-content no-header">
            <div class="menu-items">
                <!-- <button id="profile-manage-account" class="menu-item">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
                    </svg>
                    Manage Account
                </button> -->
                <button id="profile-help" class="menu-item">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M11,18H13V16H11V18M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,6A4,4 0 0,0 8,10H10A2,2 0 0,1 12,8A2,2 0 0,1 14,10C14,12 11,11.75 11,15H13C13,12.75 16,12.5 16,10A4,4 0 0,0 12,6Z" />
                    </svg>
                    Help
                </button>
                <button id="profile-share" class="menu-item">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M18,16.08C17.24,16.08 16.56,16.38 16.04,16.85L8.91,12.7C8.96,12.47 9,12.24 9,12C9,11.76 8.96,11.53 8.91,11.3L16.04,7.15C16.56,7.62 17.24,7.92 18,7.92C19.66,7.92 21,6.58 21,4.92C21,3.26 19.66,1.92 18,1.92C16.34,1.92 15,3.26 15,4.92C15,5.16 15.04,5.39 15.09,5.62L7.96,9.77C7.44,9.3 6.76,9 6,9C4.34,9 3,10.34 3,12C3,13.66 4.34,15 6,15C6.76,15 7.44,14.7 7.96,14.23L15.09,18.38C15.04,18.61 15,18.84 15,19.08C15,20.74 16.34,22.08 18,22.08C19.66,22.08 21,20.74 21,19.08C21,17.42 19.66,16.08 18,16.08Z" />
                    </svg>
                    Share Instrike
                </button>
                <button id="profile-sign-out" class="menu-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="fill: none; stroke: currentColor;">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sign Out
                </button>
            </div>
        </div>
    </div>


    <div id="_instrike_play_action" style="display: none;"></div>
    <div id="_instrike_pause_action" style="display: none;"></div>

    <top-right-actions id="top-right-actions"></top-right-actions>

    <bottom-right-actions id="bottom-right-actions" class="session-only hidden"></bottom-right-actions>
